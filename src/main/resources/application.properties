# Set the application port to 2006
server.port=2006

# --- Database Configuration ---
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.url=jdbc:sqlite:${user.home}/AcademicAnalytics/academic_data.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- JPA/Hibernate for SQLite ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# --- General Settings ---
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# --- Logging ---
logging.file.name=${user.home}/AcademicAnalytics/academic_app.log
logging.logback.rollingpolicy.max-file-size=10MB

# --- Security Configuration ---
# JWT Secret Key (MUST be at least 256 bits)
jwt.secret=ThisIsASecretKeyForJWTGenerationAndValidationThatIsLongEnoughForHS256

# Default Admin User Credentials
admin.username=admin
admin.password=password
admin.fullname=Administrator
