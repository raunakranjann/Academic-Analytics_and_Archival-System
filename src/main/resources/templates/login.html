<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Academic Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }
        .navbar {
            background-color: #2c3e50 !important;
        }
        .login-container {
            max-width: 450px;
            margin: 80px auto;
        }
        .card-header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card-header h4 {
            margin: 0;
            font-weight: 700;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-shield-lock-fill me-2"></i> SECURE LOGIN
        </a>
    </div>
</nav>

<div class="container login-container">
    <div class="card shadow-lg">
        <div class="card-header">
            <h4>Academic Analytics Portal</h4>
        </div>
        <div class="card-body p-4">
            <!-- Displays error if redirect carries ?error=true -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>

            <!-- Displays success messages if passed from controller -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- Changed to standard form POST to match @RequestParam in AuthController -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <!-- Added 'name' attribute so Spring can map to @RequestParam -->
                    <input type="text" name="username" id="username" class="form-control form-control-lg" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <!-- Added 'name' attribute so Spring can map to @RequestParam -->
                    <input type="password" name="password" id="password" class="form-control form-control-lg" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Login
                    </button>
                </div>
            </form>

            <div th:if="${userCount == 0}" class="text-center mt-3">
                <a href="/initialize-admin">Initialize First Admin Account</a>
            </div>
        </div>
    </div>
</div>

<!--
  Note: The previous JavaScript <script> block has been removed.
  The browser now handles the POST request natively, which allows
  the HttpOnly cookie to be stored and sent automatically.
-->
</body>
</html>
